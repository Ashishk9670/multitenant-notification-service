name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Spotless check
        run: mvn -B -ntp spotless:check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and unit tests
        run: mvn -B -ntp test
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          path: target/surefire-reports

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Integration tests (Testcontainers) and coverage
        run: mvn -B -ntp verify
      - name: Verify integration tests really ran (not skipped)
        run: scripts/verify-reports.sh 12
      - name: Upload coverage and failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports
          path: |
            target/site/jacoco
            target/failsafe-reports

  chaos:
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: "Chaos IT (Testcontainers + Toxiproxy, cut Redis then Kafka)"
        run: mvn -B -ntp verify -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false -Dit.groups=chaos -Dit.excludedGroups= -Djacoco.skip=true
      - name: Verify chaos test really ran (not skipped)
        run: scripts/verify-reports.sh 1
      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-reports
          path: target/failsafe-reports

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: promtool check rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.54.1 check rules /m/alerts/notification-slo.yml
      - name: promtool test rules (alert unit tests)
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.54.1 test rules /m/tests/notification-slo.test.yml
      - name: Compose config is valid
        run: docker compose --profile monitoring config -q
      - name: Boot the monitoring stack and check Grafana datasources
        run: |
          docker compose --profile monitoring up -d prometheus loki tempo alloy grafana
          for i in $(seq 1 60); do curl -fs localhost:3000/api/health >/dev/null && break; sleep 2; done
          for ds in prometheus loki; do
            for i in $(seq 1 40); do
              out=$(curl -s "localhost:3000/api/datasources/uid/$ds/health" || true)
              echo "$ds: $out"
              echo "$out" | grep -q '"status":"OK"' && break
              sleep 3
            done
            echo "$out" | grep -q '"status":"OK"'
          done
          # Grafana has no health endpoint for Tempo; query it through the Grafana datasource proxy instead
          for i in $(seq 1 40); do
            out=$(curl -s localhost:3000/api/datasources/proxy/uid/tempo/api/echo || true)
            echo "tempo: $out"
            echo "$out" | grep -q echo && break
            sleep 3
          done
          echo "$out" | grep -q echo
          # Alloy must be shipping container logs into Loki
          for i in $(seq 1 40); do
            out=$(curl -s localhost:3100/loki/api/v1/label/service/values || true)
            echo "loki services: $out"
            echo "$out" | grep -q '"loki"' && break
            sleep 3
          done
          echo "$out" | grep -q '"loki"'
          curl -fs localhost:9090/api/v1/rules | grep -q NotificationDeliverySuccessFastBurn
      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile monitoring logs --no-color | tail -300
      - name: Tear down
        if: always()
        run: docker compose --profile monitoring down -v

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Generate CycloneDX SBOM (runtime dependencies)
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.0:makeBom -DoutputFormat=json -DincludeTestScope=false -DoutputName=bom
      - name: Sanity-check the SBOM
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('target/bom.json'))
          assert d['bomFormat'] == 'CycloneDX', d['bomFormat']
          n = len(d['components'])
          print(f"CycloneDX {d['specVersion']}: {n} components")
          assert n > 50
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: target/bom.json

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Start application
        run: |
          mvn -B -ntp -DskipTests package
          nohup java -jar target/multitenant-notification-service-0.1.0.jar \
            --notification.rate-limit.tenants.e2e-ratelimited.capacity=3 --notification.rate-limit.tenants.e2e-ratelimited.refill-per-second=0.01 --notification.security.admin-token=e2e-admin-token --notification.retry.initial-delay=500ms --notification.retry.max-retries=2 \
            > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
          curl -sf localhost:8080/actuator/health | grep -q '"status":"UP"'
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
      - name: Capture README screenshots of the admin UI
        working-directory: e2e
        env:
          ADMIN_TOKEN: e2e-admin-token
        run: npx playwright test -c playwright.screenshots.config.js
      - name: Upload admin UI screenshots
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-screenshots
          path: docs/img
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-log
          path: app.log
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - name: Build image and start the full stack (compose profile app)
        run: docker compose --profile app up -d --build --wait
      - name: Container runs as non-root
        run: |
          uid=$(docker compose exec -T app id -u)
          echo "uid=$uid"; [ "$uid" != "0" ]
      - name: Smoke test
        run: ADMIN_TOKEN=dev-admin-token scripts/smoke.sh
      - name: Dump logs
        if: failure()
        run: docker compose --profile app logs --no-color | tail -300
      - name: Stop
        if: always()
        run: docker compose --profile app down -v
