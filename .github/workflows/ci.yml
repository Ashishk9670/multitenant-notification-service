name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and unit tests
        run: mvn -B -ntp test
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: target/surefire-reports

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Integration tests (Testcontainers) and coverage
        run: mvn -B -ntp verify
      - name: Upload coverage and failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: |
            target/site/jacoco
            target/failsafe-reports

  e2e:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: e2e/package-lock.json }
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Start application
        run: |
          mvn -B -ntp -DskipTests package
          nohup java -jar target/multitenant-notification-service-0.1.0.jar \
            --notification.rate-limit.tenants.e2e-ratelimited.capacity=3 --notification.rate-limit.tenants.e2e-ratelimited.refill-per-second=0.01 --notification.retry.initial-delay=500ms --notification.retry.max-retries=2 \
            > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Upload app log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
