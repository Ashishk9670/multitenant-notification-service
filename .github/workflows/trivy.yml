name: Trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and IaC
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t notification-service:scan .
      # Informational for now: Spring Boot 3.3.x (EOL) carries CRITICAL CVEs whose fixes need a Boot 4 upgrade.
      # Flip exit-code to '1' to gate once the platform is upgraded.
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: notification-service:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '0'
