<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification Admin</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c2430; }
  header { background: #1c2430; color: #fff; padding: 12px 24px; display: flex; gap: 16px; align-items: center; }
  header input { padding: 6px 8px; border-radius: 4px; border: 0; }
  main { max-width: 1000px; margin: 20px auto; padding: 0 16px; display: grid; gap: 20px; }
  section { background: #fff; border-radius: 8px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  h2 { margin-top: 0; font-size: 18px; }
  label { display: block; margin: 8px 0 2px; font-size: 13px; color: #556; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccd; border-radius: 4px; font: inherit; }
  button { margin-top: 10px; padding: 7px 14px; border: 0; border-radius: 4px; background: #2f6fed; color: #fff; cursor: pointer; }
  button.danger { background: #c0392b; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
  .msg { margin-top: 8px; font-size: 14px; min-height: 18px; }
  .err { color: #c0392b; } .ok { color: #1e8449; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<header>
  <strong>Notification Admin</strong>
  <label style="margin:0;color:#fff">API key
    <input id="api-key" data-testid="api-key" type="password" autocomplete="off" placeholder="ntf_..." style="width:260px">
  </label>
  <span id="auth-state" data-testid="auth-state" style="font-size:13px"></span>
</header>
<main>
  <section id="templates-section">
    <h2>Templates</h2>
    <div class="row">
      <div><label for="t-name">Name</label><input id="t-name" data-testid="t-name"></div>
      <div><label for="t-channel">Channel</label>
        <select id="t-channel" data-testid="t-channel"><option>EMAIL</option><option>SMS</option><option>PUSH</option></select></div>
    </div>
    <label for="t-subject">Subject</label><input id="t-subject" data-testid="t-subject">
    <label for="t-body">Body (use {{variable}} or {{variable|default}})</label><textarea id="t-body" data-testid="t-body" rows="3"></textarea>
    <button id="t-save" data-testid="t-save">Create template</button>
    <div id="t-msg" class="msg" data-testid="t-msg"></div>
    <table><thead><tr><th>Name</th><th>Channel</th><th>Subject</th><th></th></tr></thead>
      <tbody id="t-rows" data-testid="t-rows"></tbody></table>
  </section>

  <section id="send-section">
    <h2>Send notification</h2>
    <div class="row">
      <div><label for="s-channel">Channel</label>
        <select id="s-channel" data-testid="s-channel"><option>EMAIL</option><option>SMS</option><option>PUSH</option></select></div>
      <div><label for="s-priority">Priority</label>
        <select id="s-priority" data-testid="s-priority"><option>NORMAL</option><option>HIGH</option><option>LOW</option></select></div>
    </div>
    <label for="s-recipient">Recipient (email / phone / device token)</label><input id="s-recipient" data-testid="s-recipient">
    <label for="s-template">Template name (optional)</label><input id="s-template" data-testid="s-template">
    <label for="s-vars">Variables (JSON)</label><input id="s-vars" data-testid="s-vars" value="{}">
    <label for="s-body">Body (when no template)</label><textarea id="s-body" data-testid="s-body" rows="2"></textarea>
    <label for="s-idem">Idempotency-Key (optional)</label><input id="s-idem" data-testid="s-idem">
    <button id="s-send" data-testid="s-send">Send</button>
    <div id="s-msg" class="msg" data-testid="s-msg"></div>
  </section>

  <section id="deliveries-section">
    <h2>Delivery status <button id="d-refresh" data-testid="d-refresh" style="margin:0 0 0 12px">Refresh</button></h2>
    <table><thead><tr><th>Notification</th><th>Channel</th><th>Status</th><th>Attempts</th><th>Error</th></tr></thead>
      <tbody id="d-rows" data-testid="d-rows"></tbody></table>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
// The tenant is derived server-side from the API key; the UI never sends a tenant id.
const apiKey = () => $('api-key').value.trim();
const hdr = extra => Object.assign({ 'Content-Type': 'application/json', 'X-API-Key': apiKey() }, extra || {});
try { $('api-key').value = sessionStorage.getItem('apiKey') || ''; } catch (e) { /* storage unavailable */ }
let editingId = null;

function show(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }
async function err(res) { try { const j = await res.json(); return j.detail || res.statusText; } catch (e) { return res.statusText; } }
function cell(tr, text) { const td = document.createElement('td'); td.textContent = text == null ? '' : text; tr.appendChild(td); return td; }

async function loadTemplates() {
  const res = await fetch('/api/v1/templates', { headers: hdr() });
  const body = $('t-rows'); body.innerHTML = '';
  $('auth-state').textContent = res.ok ? 'authenticated' : (res.status === 401 ? 'enter a valid API key' : '');
  if (!res.ok) { show($('t-msg'), res.status + ' ' + await err(res), false); return; }
  for (const t of await res.json()) {
    const tr = document.createElement('tr');
    tr.dataset.name = t.name;
    cell(tr, t.name); cell(tr, t.channel); cell(tr, t.subject);
    const td = cell(tr, '');
    const del = document.createElement('button'); del.textContent = 'Delete'; del.className = 'danger'; del.dataset.testid = 'delete-' + t.name;
    del.onclick = async () => { await fetch('/api/v1/templates/' + t.id, { method: 'DELETE', headers: hdr() }); loadTemplates(); };
    td.appendChild(del);
    body.appendChild(tr);
  }
}

$('t-save').onclick = async () => {
  const payload = { name: $('t-name').value, channel: $('t-channel').value, subject: $('t-subject').value, body: $('t-body').value };
  const res = await fetch('/api/v1/templates', { method: 'POST', headers: hdr(), body: JSON.stringify(payload) });
  if (res.ok) { show($('t-msg'), 'Template created', true); loadTemplates(); }
  else show($('t-msg'), await err(res), false);
};

$('s-send').onclick = async () => {
  const ch = $('s-channel').value, rcp = $('s-recipient').value;
  let vars; try { vars = JSON.parse($('s-vars').value || '{}'); } catch (e) { show($('s-msg'), 'Variables must be valid JSON', false); return; }
  const recipients = { email: ch === 'EMAIL' ? rcp : null, phone: ch === 'SMS' ? rcp : null, deviceToken: ch === 'PUSH' ? rcp : null };
  const payload = { channels: [ch], priority: $('s-priority').value, recipients, variables: vars,
    templateName: $('s-template').value || null, body: $('s-body').value || null, subject: null };
  const extra = $('s-idem').value ? { 'Idempotency-Key': $('s-idem').value } : {};
  show($('s-msg'), 'Sending...', true);
  const res = await fetch('/api/v1/notifications', { method: 'POST', headers: hdr(extra), body: JSON.stringify(payload) });
  if (res.ok) { const j = await res.json(); show($('s-msg'), (j.duplicate ? 'Duplicate of ' : 'Accepted ') + j.id, true); loadDeliveries(); }
  else show($('s-msg'), res.status + ' ' + await err(res), false);
};

async function loadDeliveries() {
  const res = await fetch('/api/v1/deliveries?limit=50', { headers: hdr() });
  const body = $('d-rows'); body.innerHTML = '';
  if (!res.ok) return;
  for (const d of await res.json()) {
    const tr = document.createElement('tr');
    cell(tr, d.notificationId); cell(tr, d.channel); cell(tr, d.status).dataset.testid = 'status'; cell(tr, d.attempts); cell(tr, d.lastError);
    body.appendChild(tr);
  }
}
$('d-refresh').onclick = loadDeliveries;
$('api-key').onchange = () => {
  try { sessionStorage.setItem('apiKey', apiKey()); } catch (e) { /* ignore */ }
  loadTemplates(); loadDeliveries();
};
loadTemplates(); loadDeliveries();
setInterval(loadDeliveries, 3000);
</script>
</body>
</html>
