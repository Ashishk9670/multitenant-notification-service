server:
  port: 8080

spring:
  application:
    name: multitenant-notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notifications
    username: notif
    password: notif
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.notification.model

notification:
  topics:
    high: notifications.high
    normal: notifications.normal
    low: notifications.low
    email: notifications.channel.email
    sms: notifications.channel.sms
    push: notifications.channel.push
    retry-prefix: notifications.retry
    retry-pattern: notifications\.retry\..*
    dlq: notifications.dlq
  # consumer threads per priority; partitions per priority topic match these weights
  consumers:
    high: 6
    normal: 3
    low: 1
  retry:
    max-retries: 3
    initial-delay: 2s
    multiplier: 2.0
    max-delay: 5m
    jitter: 0.1
  rate-limit:
    capacity: 20
    refill-per-second: 10
    tenants:
      acme: { capacity: 100, refill-per-second: 50 }
  quota:
    daily-limit: 10000
    tenants:
      acme: 100000
  idempotency-ttl: 24h
  # one breaker per channel/provider; open breaker => fast failure => normal retry/DLQ flow
  circuit-breaker:
    enabled: true
    failure-rate-threshold: 50
    sliding-window-size: 20
    minimum-number-of-calls: 5
    wait-duration-in-open-state: 30s
    permitted-calls-in-half-open-state: 3
  # Provider per channel. Default "stub" logs only. Real adapters (opt-in, sandbox-friendly):
  #   email: smtp (spring.mail.*) | ses ; sms: twilio ; push: fcm. Credentials via env vars, never committed.
  provider:
    timeout: 10s
    email:
      type: ${EMAIL_PROVIDER:stub}
      smtp:
        from: ${EMAIL_FROM:}
      ses:
        region: ${SES_REGION:}
        access-key-id: ${SES_ACCESS_KEY_ID:}
        secret-access-key: ${SES_SECRET_ACCESS_KEY:}
        from: ${EMAIL_FROM:}
        endpoint: ${SES_ENDPOINT:}
    sms:
      type: ${SMS_PROVIDER:stub}
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from: ${TWILIO_FROM:}
        base-url: ${TWILIO_BASE_URL:https://api.twilio.com}
    push:
      type: ${PUSH_PROVIDER:stub}
      fcm:
        project-id: ${FCM_PROJECT_ID:}
        access-token: ${FCM_ACCESS_TOKEN:}
        base-url: ${FCM_BASE_URL:https://fcm.googleapis.com}
  # delivery receipts posted to the tenant webhook (HMAC-signed, https only, SSRF-guarded)
  webhook:
    enabled: true
    max-attempts: 5
    initial-delay: 1s
    multiplier: 2.0
    max-delay: 5m
    jitter: 0.1
    timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # OpenTelemetry tracing (OTLP/HTTP). Sampling is 0 by default so nothing is exported unless enabled, e.g.
  # MANAGEMENT_TRACING_SAMPLING_PROBABILITY=1.0 MANAGEMENT_OTLP_TRACING_ENDPOINT=http://collector:4318/v1/traces
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
