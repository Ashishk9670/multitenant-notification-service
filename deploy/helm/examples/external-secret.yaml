# External Secrets Operator: syncs the three required keys from a cloud secret manager into the Secret that the chart
# references via `existingSecret` (default name: notification-service). No secret material lives in git.
# Example uses AWS Secrets Manager; swap the provider block for Vault, GCP Secret Manager, Azure Key Vault, ...
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: notification
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader   # IRSA-annotated ServiceAccount, created out of band
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service
  namespace: notification
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: notification-service        # must equal `existingSecret` in the chart values
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: notification-service/prod
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: notification-service/prod
        property: db_password
    - secretKey: NOTIFICATION_SECURITY_ADMIN_TOKEN
      remoteRef:
        key: notification-service/prod
        property: admin_token
