# Sealed Secrets alternative. The ciphertext below is a PLACEHOLDER, not a real secret.
# Generate the real file (safe to commit) with the cluster's public certificate:
#
#   kubectl create secret generic notification-service -n notification \
#     --from-literal=SPRING_DATASOURCE_USERNAME=... \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --from-literal=NOTIFICATION_SECURITY_ADMIN_TOKEN=... \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: notification-service
  namespace: notification
spec:
  encryptedData:
    SPRING_DATASOURCE_USERNAME: AgBPLACEHOLDER_replace_with_kubeseal_output
    SPRING_DATASOURCE_PASSWORD: AgBPLACEHOLDER_replace_with_kubeseal_output
    NOTIFICATION_SECURITY_ADMIN_TOKEN: AgBPLACEHOLDER_replace_with_kubeseal_output
  template:
    metadata:
      name: notification-service
      namespace: notification
    type: Opaque
